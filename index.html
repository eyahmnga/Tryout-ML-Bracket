<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE FINAL SELECTION - Team Hashira Mobile Legends Try Out</title>
  <meta property="og:title" content="THE FINAL SELECTION - Team Hashira MLBB Bracket">
  <meta property="og:description" content="Official Team Hashira Mobile Legends Try-Out Tournament Bracket">
  <meta property="og:type" content="website">
  <meta name="description" content="Official Team Hashira Mobile Legends Try-Out Tournament Bracket">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Montserrat:ital,wght@0,600;0,700;0,800;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0c0105; }
    body {
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
      overflow-x: hidden;
    }

    /* Wrapper that gets resized to the scaled stage size */
    #frame { position: relative; }

    /* Design stage: 2000 x 1080 (2x of a 1000 x 540 layout) */
    #stage {
      position: absolute;
      top: 0; left: 0;
      width: 2000px;
      height: 1080px;
      transform-origin: 0 0;
      overflow: hidden;
      border-radius: 6px;
      background:
        linear-gradient(158deg, transparent 0 60%, rgba(150, 14, 32, .45) 60% 63%, transparent 63% 100%),
        linear-gradient(158deg, transparent 0 66%, rgba(120, 10, 26, .35) 66% 74%, transparent 74% 100%),
        linear-gradient(22deg,  transparent 0 72%, rgba(160, 16, 36, .40) 72% 76%, transparent 76% 100%),
        linear-gradient(22deg,  transparent 0 78%, rgba(110, 8, 24, .35) 78% 88%, transparent 88% 100%),
        linear-gradient(200deg, transparent 0 44%, rgba(90, 6, 20, .45) 44% 52%, transparent 52% 100%),
        linear-gradient(-30deg, transparent 0 18%, rgba(140, 12, 30, .30) 18% 26%, transparent 26% 100%),
        radial-gradient(ellipse at 25% 25%, rgba(70, 6, 22, .9) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(90, 8, 26, .8) 0%, transparent 50%),
        #17020a;
    }

    svg.lines {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    svg.lines path { stroke: #d7d2d4; stroke-width: 1.1; fill: none; }

    /* Headers */
    .title {
      position: absolute; left: 0; right: 0; text-align: center;
      font-family: 'League Spartan', sans-serif; font-weight: 800;
      font-size: 76px; letter-spacing: 1px; line-height: 1; color: #fff;
      top: 52px;
      text-shadow: 0 4px 14px rgba(0,0,0,.6);
    }
    .subtitle {
      position: absolute; left: 0; right: 0; text-align: center;
      top: 124px; font-weight: 900; font-style: italic;
      font-size: 34px; color: #fbbf24; letter-spacing: .5px;
    }
    .tryout {
      position: absolute; left: 0; right: 0; text-align: center;
      top: 170px; font-weight: 800; font-size: 28px; color: #fff;
    }
    .section {
      position: absolute; top: 210px;
      font-weight: 900; font-style: italic; font-size: 36px; color: #fbbf24;
    }
    .label {
      position: absolute; transform: translate(-50%, -50%);
      font-weight: 800; font-size: 26px; color: #fff; white-space: nowrap;
      text-align: center; line-height: 1.1;
    }
    .mlabel {
      position: absolute; transform: translate(-50%, -50%);
      font-weight: 800; font-size: 17px; color: #ffffff; z-index: 4;
      pointer-events: none;
    }

    /* Match boxes */
    .box {
      position: absolute;
      background: #fff7f3;
      border: 3px solid #e3232f;
      border-radius: 16px;
      box-shadow: -6px 4px 0 #a1141f, 6px 4px 0 #a1141f, 0 6px 14px rgba(0,0,0,.45);
      color: #1d3a6e;
      font-weight: 700;
      font-size: 17px;
      line-height: 1.1;
      text-transform: uppercase;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      padding: 0 10px;
      z-index: 3;
      outline: none;
    }
    .box.small { font-size: 14px; text-transform: none; }
    .box.winner { border-color: #fbbf24; box-shadow: -6px 4px 0 #b45309, 6px 4px 0 #b45309, 0 0 24px rgba(251,191,36,.55); }
    body.edit .box { cursor: text; }
    body.edit .box:focus { border-color: #3b82f6; }

    .flag { position: absolute; top: 28px; width: 160px; height: 140px; }

    .note { margin-top: 10px; font-size: 13px; color: #94a3b8; text-align: center; padding: 0 12px; }
    .toolbar { display: none; gap: 10px; margin-bottom: 10px; }
    body.edit .toolbar { display: flex; }
    .btn { background: #e11d48; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .btn.gray { background: #334155; }

    @media print {
      body { padding: 0; }
      .note, .toolbar { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="btn" onclick="window.print()">🖨️ Print / PDF</button>
    <button class="btn gray" onclick="resetLocal()">🔄 Reset Local Edits</button>
  </div>

  <div id="frame">
    <div id="stage"></div>
  </div>

  <div class="note">🏆 Team Hashira Mobile Legends Try-Out — Official Bracket</div>

  <script>
    /* =========================================================
       OFFICIAL BRACKET DATA
       Para mag-update ng resulta: palitan lang ang text sa loob
       ng quotes (" ") tapos i-commit/push. Auto-update ang site.
       ========================================================= */
    const DATA = {
      // ---- UPPER BRACKET : ROUND 1 (BO1) ----
      u1a: "TEAM TARA S",       u1b: "CASH OUT",
      u3a: "TEAM LOBROSO",      u3b: "ALA KANIN JAN BUSSENG",
      u2a: "TEAM LULOKOYS",     u2b: "TEAM JORTS",
      u4a: "PALUBOG 1",         u4b: "PALUBOG 2",

      // ---- UPPER BRACKET : ROUND 2 (BO3) ----
      s1: "", s2: "",           // Winner M1 vs Winner M3
      s3: "", s4: "",           // Winner M2 vs Winner M4

      // ---- UPPER BRACKET FINAL (BO3) ----
      f1: "", f2: "",

      // ---- GRAND FINALS (BO5) ----
      gfL: "",                  // Upper Bracket Champion
      gfR: "",                  // Lower Bracket Champion
      champ: "",                // FINAL TEAM REPRESENTATIVE

      // ---- LOWER BRACKET ----
      L1: "L1", L3: "L3", L2: "L2", L4: "L4",   // Round 1 (BO1)
      l2a: "", l2b: "",                          // Round 2 (BO1)
      L5: "L5", L6: "L6",
      l3a: "", l3b: "",                          // Round 3 (BO1)
      lf1: "",                                   // Lower Final (BO3)
      lf2: "L IN Match 7 of BO3 UPPER BRACKET"
    };

    // Highlight these box ids as winners (gold border), e.g. ["u1a","s1"]
    const WINNERS = [];

    /* ================= LAYOUT (1000 x 540 design units) ================= */
    const U = 2; // scale to 2000 x 1080 stage
    const H = 23;

    // id: [left x, center y, width, extra class]
    const BOXES = {
      u1a: [42, 177, 92], u1b: [42, 207, 92],
      u3a: [42, 259, 92], u3b: [42, 290, 92, "small"],
      u2a: [42, 357, 92], u2b: [42, 387, 92],
      u4a: [42, 439, 92], u4b: [42, 470, 92],

      s1: [163, 219, 90], s2: [163, 249, 90],
      s3: [163, 399, 90], s4: [163, 429, 90],

      f1: [236, 309, 90], f2: [236, 339, 90],

      gfL: [362, 324, 86],
      gfR: [474, 324, 84],
      champ: [417, 180, 86],

      lf1: [583, 309, 88], lf2: [583, 340, 88, "small"],
      l3a: [688, 291, 88], l3b: [688, 325, 88],
      l2a: [790, 229, 88], l2b: [790, 258, 88],
      L5:  [795, 346, 86], L6:  [795, 376, 86],
      L1:  [898, 188, 88], L3:  [898, 217, 88],
      L2:  [898, 269, 88], L4:  [898, 299, 88]
    };

    const LABELS = [
      ["BO1", 88, 150], ["BO3", 210, 184], ["BO3", 283, 277],
      ["BO1", 942, 150], ["BO1", 834, 192], ["BO1", 732, 265], ["BO3", 612, 277],
      ["VS", 460, 326], ["BO5", 460, 352],
      ["FINAL TEAM<br>REPRESENTATIVE", 460, 148]
    ];
    const MLABELS = [["M1", 88, 192], ["M3", 88, 274], ["M2", 88, 372], ["M4", 88, 455]];

    // [sourceA, sourceB, target, direction]  'R' = flows right, 'L' = flows left
    const LINKS = [
      ["u1a", "u1b", "s1", "R"], ["u3a", "u3b", "s2", "R"],
      ["u2a", "u2b", "s3", "R"], ["u4a", "u4b", "s4", "R"],
      ["s1", "s2", "f1", "R"],   ["s3", "s4", "f2", "R"],
      ["f1", "f2", "gfL", "R"],
      ["L1", "L3", "l2a", "L"],  ["L2", "L4", "l2b", "L"],
      ["l2a", "l2b", "l3a", "L"],["L5", "L6", "l3b", "L"],
      ["l3a", "l3b", "lf1", "L"],["lf1", "lf2", "gfR", "L"]
    ];

    /* ================= RENDER ================= */
    const stage = document.getElementById('stage');
    const isEdit = new URLSearchParams(location.search).has('edit');
    if (isEdit) document.body.classList.add('edit');
    const local = isEdit ? JSON.parse(localStorage.getItem('hashiraBracket') || '{}') : {};

    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      stage.appendChild(e);
      return e;
    }

    // Headers
    el('div', 'title', 'THE FINAL SELECTION');
    el('div', 'subtitle', 'TEAM HASHIRA MOBILE LEGENDS');
    el('div', 'tryout', 'TRY OUT');
    const up = el('div', 'section', 'UPPER BRACKET');   up.style.left = (42 * U) + 'px';
    const lo = el('div', 'section', 'LOWER BRACKET');   lo.style.right = (14 * U) + 'px';

    // Checkered flags
    function flagSVG(mirror) {
      let sq = '';
      const n = 14;
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        if ((r + c) % 2 === 0) sq += `<rect x="${c * n}" y="${r * n}" width="${n}" height="${n}" fill="#fff"/>`;
      }
      return `<svg class="flag" viewBox="-4 -10 66 70" style="${mirror ? 'right' : 'left'}:36px">
        <g transform="${mirror ? 'translate(58,0) scale(-1,1) ' : ''}skewY(14) skewX(-8)">${sq}</g></svg>`;
    }
    stage.insertAdjacentHTML('beforeend', flagSVG(false) + flagSVG(true));

    // Labels
    LABELS.forEach(([t, x, y]) => {
      const l = el('div', 'label', t);
      l.style.left = (x * U) + 'px'; l.style.top = (y * U) + 'px';
      if (t.includes('REPRESENTATIVE')) l.style.fontSize = '22px';
    });
    MLABELS.forEach(([t, x, y]) => {
      const l = el('div', 'mlabel', t);
      l.style.left = (x * U) + 'px'; l.style.top = (y * U) + 'px';
    });

    // Trophy icon
    stage.insertAdjacentHTML('beforeend',
      `<svg viewBox="0 0 24 24" style="position:absolute;left:${383 * U}px;top:${166 * U}px;width:${28 * U}px;height:${28 * U}px;fill:#fff">
        <path d="M19 4h-2V2H7v2H5a2 2 0 0 0-2 2v1a5 5 0 0 0 4.4 5A5 5 0 0 0 11 15.9V19H8v2h8v-2h-3v-3.1a5 5 0 0 0 3.6-3.9A5 5 0 0 0 21 7V6a2 2 0 0 0-2-2ZM5 7V6h2v4A3 3 0 0 1 5 7Zm14 0a3 3 0 0 1-2 3V6h2Z"/>
      </svg>`);

    // Boxes
    Object.entries(BOXES).forEach(([id, [x, y, w, cls]]) => {
      const b = el('div', 'box' + (cls ? ' ' + cls : ''));
      b.id = id;
      b.style.left = (x * U) + 'px';
      b.style.top = ((y - H / 2) * U) + 'px';
      b.style.width = (w * U) + 'px';
      b.style.height = (H * U) + 'px';
      b.textContent = (local[id] !== undefined ? local[id] : DATA[id]) || '';
      if (WINNERS.includes(id)) b.classList.add('winner');
      if (isEdit) {
        b.contentEditable = 'true';
        b.addEventListener('input', () => {
          local[id] = b.textContent;
          localStorage.setItem('hashiraBracket', JSON.stringify(local));
        });
      }
    });

    // Connector lines
    const R = id => BOXES[id][0] + BOXES[id][2];
    const Lx = id => BOXES[id][0];
    const Y = id => BOXES[id][1];
    let d = '';
    LINKS.forEach(([a, b, t, dir]) => {
      const ya = Y(a), yb = Y(b), yt = Y(t);
      const top = Math.min(ya, yb, yt), bot = Math.max(ya, yb, yt);
      if (dir === 'R') {
        const sx = Math.max(R(a), R(b)), tx = Lx(t), xj = (sx + tx) / 2;
        d += `M${R(a)} ${ya}H${xj}M${R(b)} ${yb}H${xj}M${xj} ${top}V${bot}M${xj} ${yt}H${tx}`;
      } else {
        const sx = Math.min(Lx(a), Lx(b)), tx = R(t), xj = (sx + tx) / 2;
        d += `M${Lx(a)} ${ya}H${xj}M${Lx(b)} ${yb}H${xj}M${xj} ${top}V${bot}M${xj} ${yt}H${tx}`;
      }
    });
    // Grand finals stem up to champion box
    const cx = BOXES.champ[0] + BOXES.champ[2] / 2;
    d += `M${cx} ${Y('champ') + H / 2}V${312}`;
    stage.insertAdjacentHTML('afterbegin',
      `<svg class="lines" viewBox="0 0 1000 540" preserveAspectRatio="none"><path d="${d}"/></svg>`);

    // Responsive scaling
    function fit() {
      const k = Math.min((window.innerWidth - 16) / 2000, 1);
      stage.style.transform = `scale(${k})`;
      const f = document.getElementById('frame');
      f.style.width = (2000 * k) + 'px';
      f.style.height = (1080 * k) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();

    function resetLocal() {
      if (confirm('I-reset ang local edits?')) { localStorage.removeItem('hashiraBracket'); location.reload(); }
    }
  </script>
</body>
</html>
